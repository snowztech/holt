name: Bug
description: Something in Holt doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text in Safari
        2. Press ⇧⌘V
        3. ...
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Holt version
      description: Settings → About.
      placeholder: "0.1.0"
  - type: dropdown
    id: sync
    attributes:
      label: Does it involve sync between Macs?
      options:
        - "No"
        - "Yes, both Macs on the same Wi-Fi"
        - "Yes, Macs on different networks"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Optional. In Console.app, filter by `subsystem:app.holtclip.Holt`."
      render: text
