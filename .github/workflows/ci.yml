name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      # No signing identity on the runner, so the Makefile signs ad hoc.
      - name: Build the app
        run: make mac
      - uses: actions/upload-artifact@v4
        with:
          name: Holt.app
          path: build/Holt.app
          retention-days: 7
