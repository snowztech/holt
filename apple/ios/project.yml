# The iPhone app and its extensions. `make ios` generates Holt.xcodeproj from this file,
# so the project itself is never committed and never conflicts.
name: Holt
options:
  bundleIdPrefix: app.holtclip
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: X935Q2B2RF
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The core is built for Apple Silicon only, like the Mac release.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

# Everything the app and both extensions need: the core and the shared code.
targetTemplates:
  HoltCore:
    sources:
      - path: Shared
      # The generated bindings, compiled into each target instead of a separate module.
      - path: ../Sources/HoltCore
    dependencies:
      - framework: ../HoltCoreFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    entitlements:
      path: ${target_name}.entitlements
      properties:
        # The app and its extensions share one history and one pairing.
        com.apple.security.application-groups: [group.app.holtclip.Holt]

targets:
  Holt:
    type: application
    platform: iOS
    templates: [HoltCore]
    sources:
      - path: Sources
      # Skip, his face and the colors, the same files the Mac app builds as a module.
      - path: ../Sources/HoltBrand
    dependencies:
      - target: HoltShare
      - target: HoltControls
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Holt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Holt connects directly to your Macs on this network to sync clips.
        # Macs with Settings → Devices open announce themselves over Bonjour, for pairing with the code.
        NSBonjourServices: [_holt-pair._tcp]
        # The QR code in Holt on the Mac is a holt://pair link the Camera opens here.
        CFBundleURLTypes:
          - CFBundleURLName: app.holtclip.Holt
            CFBundleURLSchemes: [holt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.holtclip.Holt
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Share → Holt from any app.
  HoltShare:
    type: app-extension
    platform: iOS
    templates: [HoltCore]
    sources:
      - path: Share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Holt
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.holtclip.Holt.share

  # The Control Center and lock screen button. Controls need iOS 18.
  HoltControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    templates: [HoltCore]
    sources:
      - path: Controls
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Holt
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.holtclip.Holt.controls
