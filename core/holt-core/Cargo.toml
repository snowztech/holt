[package]
name = "holt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "holt_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
# libc 0.2.190 made the net/route.h constants and in6_ifreq macOS-only, and iroh's
# netwatch and netdev use them on iOS too, so newer versions don't build for iPhone.
# Lift this once those crates handle it.
libc = "=0.2.189"
n0-future = "0.3"
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32", features = ["cli"] }
