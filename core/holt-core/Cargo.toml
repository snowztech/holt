[package]
name = "holt-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "holt_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
blake3 = "1.8"
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spake2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32", features = ["cli"] }
